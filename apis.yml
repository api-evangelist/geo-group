aid: geo-group
name: The GEO Group
description: >-
  The GEO Group, Inc. (NYSE: GEO) is a publicly traded private corrections and
  community supervision company headquartered in Boca Raton, Florida. Founded
  in 1984 as Wackenhut Corrections Corporation and rebranded in 2004, it is the
  largest private prison operator in the United States and a primary
  contractor to U.S. Immigration and Customs Enforcement (ICE), the U.S.
  Marshals Service, the Federal Bureau of Prisons, and numerous state
  departments of corrections. As of 2024 the company owned or managed
  approximately 80,000 beds across roughly 99 facilities and reported
  $2.424 billion in revenue. Its wholly owned subsidiary BI Incorporated
  operates the federal Intensive Supervision Appearance Program (ISAP) and
  builds the ankle monitors, GPS trackers, voice-verification systems and
  SmartLINK smartphone app used to monitor people in immigration proceedings
  and community supervision. GEO Group publishes no public developer API and
  has no GitHub presence; the only "platform" surfaces it exposes are
  customer-facing operational systems (BI TotalAccess for officers, BI
  SmartLINK for supervised individuals) used inside its own contracts. This
  repository documents the corporate footprint, the technology subsidiary,
  and the public-record controversies surrounding the firm under the second
  Trump administration's 2025+ ICE detention expansion, for purposes of the
  API Evangelist network's coverage of API absence in sensitive sectors.
