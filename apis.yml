apis:
  - aid: geo-group:geo-secure-services
    name: GEO Secure Services
    humanURL: https://www.geogroup.com
    description: >-
      GEO Secure Services designs, builds, finances and operates secure
      correctional and ICE detention facilities under contracts with federal,
      state and international government agencies. No public developer API,
      OpenAPI spec, data feed, or inmate-locator API is published; all
      facility-level information flows are private contract integrations with
      the contracting agency.
    tags:
      - Corrections
      - Private Prisons
      - Immigration Detention
    properties:
