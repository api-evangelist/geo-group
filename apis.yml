        url: https://www.geogroup.com
      - type: Documentation
        url: https://www.geogroup.com/About-Us
      - type: Customers
        url: https://www.geogroup.com/Services
  - aid: geo-group:geo-care
    name: GEO Care
    humanURL: https://www.geogroup.com
    description: >-
      GEO Care delivers community-based reentry, residential treatment,
      cognitive behavioral programming, substance-abuse treatment and
      non-residential supervision through GEO Reentry Services and partner
      facilities. Reported scale on the corporate website is roughly 31,500
      daily participants in evidence-based programs. No public developer API
      is published.
    tags:
      - Corrections
      - Reentry
      - Behavioral Health
    properties:
      - type: Website
        url: https://www.geogroup.com
      - type: Documentation
        url: https://www.geogroup.com/Services
  - aid: geo-group:geo-transport
    name: GEO Transport
    humanURL: https://www.geogroup.com
    description: >-
      GEO Transport Inc. provides secure transportation services for detainees
      and inmates between facilities, courts and removal flights, primarily
      under federal contract. No public developer API is published.
    tags:
      - Corrections
      - Transportation
    properties:
      - type: Website
        url: https://www.geogroup.com
  - aid: geo-group:bi-incorporated
    name: BI Incorporated
    humanURL: https://bi.com
    description: >-
      BI Incorporated, acquired by GEO Group in 2011, is the technology
      subsidiary that builds and operates the electronic monitoring stack used
      across community supervision and ICE's Intensive Supervision Appearance
      Program (ISAP). Product line includes BI VeriWatch 2 (wrist-worn GPS),
      BI SmartLINK (smartphone monitoring app with facial-recognition
      check-in), BI SmartBAND 1.0 (Bluetooth Low Energy wearable paired with
      SmartLINK), BI HomeGuard 20|20 (RF home monitoring), BI SoberTech
      (handheld breathalyzer), BI TotalAccess (officer case-management
      platform consolidating monitoring data), and BI Agency Assist
      (centralized administrative support for probation and parole agencies).
      None of these products expose a documented public developer API; data
      flows are private integrations with the contracting government
      supervision agency.
    tags:
      - Electronic Monitoring
      - GPS Tracking
      - Surveillance
      - Immigration
    properties:
      - type: Website
        url: https://bi.com
      - type: APIReference
        url: https://bi.com
      - type: Documentation
        url: https://bi.com
